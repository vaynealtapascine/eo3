        {:else if chunk === ':::' && chunks[i - 2]?.startsWith('::: ')}
        {:else if !chunks[i - 1]?.startsWith('::: ') || chunks[i + 1] !== ':::'}
            <FicText text={chunk} mode="blocks" />
        {/if}
    {/each}
</div>
