/* This is a static text log, not an executable terminal. */
#workskin .fic-terminal {
    max-width: 40em;
    margin: 2em auto;
    padding: 1.2em;
    background: #202b28;
    color: #e0e9e3;
    border: 1px solid #405a4d;
    border-radius: 0.5em;
    font-family: 'Courier New', monospace;
    font-size: 0.85em;
    line-height: 1.7;
    overflow-wrap: break-word;
}
