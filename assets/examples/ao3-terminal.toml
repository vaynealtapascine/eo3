    margin: 0 0 0.65em;
}
#workskin .fic-terminal-bar {
    color: #aec6b9;
    border-bottom: 1px solid #405a4d;
    padding-bottom: 0.7em;
    font-size: 0.85em;
}
#workskin .fic-terminal-command {
    color: #b3dfb5;
