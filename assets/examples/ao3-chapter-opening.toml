version = 1
title = "AO3 · Chapter opening and scene breaks"
sharedStyles = 1

[[modules]]
plugin = "source.text"
title = "Chapter · edit title, epigraph and scenes"
data.language = "html"
data.contents = '''
<div class="fic-chapter">
  <div class="fic-chapter-heading"><p class="fic-chapter-number">Chapter 01</p><h3>Lorem ipsum</h3><p class="fic-chapter-subtitle">01 January · Lorem ipsum</p></div>
  <blockquote class="fic-chapter-epigraph"><p>“Lorem ipsum dolor sit amet, consectetur adipiscing elit.”</p><p class="fic-chapter-attribution">— Lorem ipsum</p></blockquote>
  <p class="fic-chapter-first"><span class="fic-chapter-initial">L</span>orem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
  <p>Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
  <hr class="fic-chapter-break" />
  <p>Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.</p>
  <p>Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p>
</div>
'''
sends = ["output"]

[[modules]]
plugin = "source.text"
title = "Chapter workskin · epigraph and drop cap"
data.language = "css"
data.contents = '''
#workskin .fic-chapter { max-width: 37em; margin: 2em auto; font-family: Georgia, serif; line-height: 1.85; }
#workskin .fic-chapter-heading { text-align: center; padding: 1em 0 1.8em; border-bottom: 1px solid #a6b6a7; }
#workskin .fic-chapter-number { font-family: Arial, sans-serif; text-transform: uppercase; font-size: 0.65em; letter-spacing: 0.2em; }
#workskin .fic-chapter h3 { font-size: 2em; font-weight: normal; margin: 0.5em 0; }
#workskin .fic-chapter-subtitle { font-style: italic; font-size: 0.8em; }
#workskin .fic-chapter-epigraph { border: 0; margin: 2em auto; max-width: 26em; padding: 0 1em; text-align: center; font-size: 0.9em; font-style: italic; }
#workskin .fic-chapter-attribution { text-align: right; font-size: 0.8em; }
#workskin .fic-chapter-initial { float: left; font-size: 3.4em; line-height: 0.9; padding: 0.1em 0.12em 0 0; }
#workskin .fic-chapter-break { clear: both; width: 4em; margin: 2.2em auto; border: 0; border-top: 3px double #7c927f; }
'''
sends = ["output"]
