version = 1
title = "Welcome to eo3"
sharedStyles = 1

[[modules]]
plugin = "source.text"
title = "Chapter text"
data.contents = '''
<p>This page is a live Archive of Our Own preview — click anywhere to start typing, or press <strong>new</strong> in the toolbar for a blank chapter. Select any text to open the floating formatting bar, and click its chevron to expand all formatting controls.</p>

<h3>Try styles right on the page</h3>

<p>Hover or tap the dotted phrase to see its translation: <span class="fx-translate">«L’aventure commence ici.»<span class="fx-translate-tip"><span class="fx-translate-paren"> (</span>The adventure begins here.<span class="fx-translate-paren">)</span></span></span> Click it to edit the translation, or hover over <span class="fx-redacted">classified plot twists</span>, <span class="fx-highlight">key details</span>, and <span class="fx-smallcaps">small-caps emphasis</span> — all powered by pure AO3 Work Skin CSS.</p>

<div class="fx-letter">
  <p><em>Dear Writer,</em></p>
  <p>Styled blocks like letters, callouts, journals, and terminals can be edited right here in the preview — no raw HTML required. Click inside any styled box to write, or use the floating toolbar to unwrap or exit it.</p>
</div>

<h3>Your writing toolkit</h3>

<ul>
  <li><p><strong>Styles (✦)</strong> — Apply inline effects like <em>Redacted</em> and <em>Translate on hover</em>, wrap paragraphs in styled blocks, or open <em>Manage &amp; import styles…</em> to install and share custom <code>.eo3styles.json</code> Style Packs.</p></li>
  <li><p><strong>Format (Aa)</strong> — Headings, alignment, links, ruby glosses, and chapter breaks.</p></li>
  <li><p><strong>Insert (+)</strong> — Drop in ready-made AO3 templates — text messages, group chats, emails, case files, newspaper clippings, and more — all editable inline in the preview.</p></li>
  <li><p><strong>Work Skin CSS ({ })</strong> — View or tweak the shared stylesheet for every chapter live.</p></li>
  <li><p><strong>Sidebar</strong> — Switch between saved works, backups, and full template examples.</p></li>
</ul>

<div class="fx-callout">
  <p><strong>Ready to post?</strong> Use <strong>Copy HTML</strong> and <strong>Copy Workskin CSS</strong> in the preview header whenever you’re ready — eo3 automatically sanitizes HTML and scopes CSS for AO3’s <code>#workskin</code> rules.</p>
</div>

<details class="fx-spoiler">
  <summary>Tips for getting started</summary>
  <p><strong>Multi-chapter works:</strong> Add chapters from the chapter bar — your Work Skin CSS stays shared across every chapter automatically.</p>
  <p><strong>Simple vs. Nodes:</strong> Switch between <em>simple</em> and <em>nodes</em> in the toolbar any time if you want graph wiring, Sass/Less, or custom Svelte templates.</p>
  <p><strong>Start fresh:</strong> Press <code>Ctrl+A</code> / <code>⌘A</code> here to clear this guide and write right away, or click <strong>new</strong> in the toolbar.</p>
</details>'''
data.language = "html-contenteditable"
sends = ["output"]

[[modules]]
plugin = "source.shared-styles"
data.contents = '''
/* eo3:piece:translate */
.fx-translate {
  position: relative;
  border-bottom: 1px dotted currentColor;
  cursor: pointer;
}
.fx-translate .fx-translate-tip {
  visibility: hidden;
  opacity: 0;
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 20em;
  margin-bottom: 0.35em;
  padding: 0.3em 0.65em;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 0.35em;
  background-color: #222222;
  color: #f8f8f8;
  font-size: 0.85em;
  font-style: normal;
  font-weight: normal;
  line-height: 1.35;
  text-align: center;
  text-indent: 0;
  text-decoration: none;
  white-space: normal;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  z-index: 10;
  transition: opacity 0.15s ease;
}
.fx-translate .fx-translate-paren {
  display: none;
}
.fx-translate:hover .fx-translate-tip,
.fx-translate:focus .fx-translate-tip,
.fx-translate:active .fx-translate-tip {
  visibility: visible;
  opacity: 1;
}

/* eo3:piece:redacted */
.fx-redacted {
  background-color: #1a1a1a;
  color: #1a1a1a;
  padding: 0 0.25em;
  border-radius: 0.15em;
  transition: color 0.15s ease;
}
.fx-redacted:hover {
  color: #f5f5f5;
}

/* eo3:piece:highlight */
.fx-highlight {
  background-color: #fff3a1;
  color: #222222;
  padding: 0.04em 0.25em;
  border-radius: 0.2em;
}

/* eo3:piece:smallcaps */
.fx-smallcaps {
  font-variant: small-caps;
  letter-spacing: 0.06em;
}

/* eo3:piece:letter */
.fx-letter {
  background-color: #fbf7ee;
  color: #2b241d;
  border: 1px solid #dfd3bd;
  padding: 1.1em 1.4em;
  margin: 1em auto;
  max-width: 34em;
  font-family: Georgia, serif;
  line-height: 1.65;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.fx-letter p:last-child {
  margin-bottom: 0;
}

/* eo3:piece:callout */
.fx-callout {
  border-left: 4px solid #990000;
  background-color: rgba(153, 0, 0, 0.07);
  padding: 0.75em 1em;
  margin: 1em 0;
  border-radius: 0 0.35em 0.35em 0;
}
.fx-callout p:last-child {
  margin-bottom: 0;
}

/* eo3:piece:spoiler */
.fx-spoiler {
  margin: 1em 0;
  padding: 0.6em 0.9em;
  border: 1px solid #b8b8b8;
  border-radius: 0.45em;
  background-color: rgba(128, 128, 128, 0.08);
}
.fx-spoiler summary {
  font-weight: bold;
  cursor: pointer;
}
.fx-spoiler p:last-child {
  margin-bottom: 0;
}
'''
sends = ["output"]
