# Builds eo3 (app + workskin examples + /about gallery) and deploys it to eo3.dev
# on Cloudflare Workers.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN (Workers Scripts edit + eo3.dev Workers Routes/DNS edit)
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-eo3-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Prune source maps before upload
        run: find dist -name '*.map' -delete

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Verify eo3.dev entry page
        run: node scripts/verify-deploy.mjs https://eo3.dev
