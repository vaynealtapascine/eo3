# Re-extracts wafrn's post sanitizer settings from its latest frontend code. When they changed,
# opens a PR updating src/targets/wafrn/sanitizer-config.json (which the wafrn target runs on);
# its title says whether the parity tests still pass.
name: wafrn upstream parity

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:wafrn-update
      - id: parity
        run: |
          if git diff --quiet src/targets/wafrn/sanitizer-config.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./src/targets/wafrn/sanitizer-config.json').commit.slice(0, 7)")" >> "$GITHUB_OUTPUT"
          if npx vitest run test/wafrn-parity > parity.log 2>&1; then echo "result=passing" >> "$GITHUB_OUTPUT"; else echo "result=failing" >> "$GITHUB_OUTPUT"; fi
          tail -n 40 parity.log
      - if: steps.parity.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: wafrn-upstream-parity
          add-paths: src/targets/wafrn/sanitizer-config.json
          commit-message: 'feat(wafrn): update sanitizer settings to wafrn@${{ steps.parity.outputs.commit }}'
          title: 'wafrn sanitizer changed upstream (wafrn@${{ steps.parity.outputs.commit }}): parity ${{ steps.parity.outputs.result }}'
          body: |
            wafrn changed the sanitize-html settings it applies to posts. This updates
            `src/targets/wafrn/sanitizer-config.json`, which the wafrn target uses directly; the
            parity tests are currently **${{ steps.parity.outputs.result }}**.

            If they fail because wafrn upgraded sanitize-html, update the pinned devDependency
            to the `sanitizeHtmlVersion` in the config. Review the diff and merge.
